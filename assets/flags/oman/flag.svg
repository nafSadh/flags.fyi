<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Red vertical bar on left side with emblem -->
  <rect width="400" height="800" fill="#CE1126"/>
  <!-- White stripe -->
  <rect x="400" width="400" height="800" fill="#FFFFFF"/>
  <!-- Red stripe -->
  <rect x="400" y="0" width="400" height="267" fill="#CE1126"/>
  <!-- Green stripe -->
  <rect x="400" y="267" width="400" height="266" fill="#007A5E"/>
  <!-- Green stripe bottom -->
  <rect x="400" y="533" width="400" height="267" fill="#007A5E"/>
  <!-- Simplified khanjar dagger in red bar -->
  <g transform="translate(200, 400)">
    <!-- Dagger blade -->
    <path d="M -30 -60 L 0 60 L 30 -60 Z" fill="#FFFFFF" opacity="0.7"/>
    <!-- Dagger hilt -->
    <rect x="-15" y="50" width="30" height="30" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>