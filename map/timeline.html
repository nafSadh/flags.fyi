<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Timeline — Flags.fyi</title>
<meta name="description" content="Interactive timeline of national flags with event-density scaling and lineage connections.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #8f00ff; --primary-light: #f3e5ff; --primary-muted: #e6ccff;
  --text: #363636; --text-light: #7a7a7a; --bg: #fff; --border: #e5e5e5;
  --navbar-h: 52px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--text); background: var(--bg); }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: var(--navbar-h);
  background: linear-gradient(141deg, #5000cc, #8f00ff 71%, #c01aff);
  display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; }
.site-logo { display: inline-flex; align-items: center; gap: .4rem; font-weight: 700; color: #fff; font-size: 1rem; text-decoration: none; }
.nav-r { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nb { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 4px; font: 500 .72rem var(--font); cursor: pointer; transition: all .12s; text-decoration: none; white-space: nowrap; }
.nb:hover { background: rgba(255,255,255,.22); color: #fff; text-decoration: none; }
.nb.on { background: rgba(255,255,255,.28); color: #fff; border-color: rgba(255,255,255,.45); }
.sep { color: rgba(255,255,255,.2); margin: 0 2px; }

/* density ruler at top shows the scale warping */
#ruler { position: absolute; top: var(--navbar-h); left: 150px; right: 0; height: 26px; background: #fafafa; border-bottom: 1px solid var(--border); overflow: hidden; z-index: 6; }
#rulerCv { position: relative; height: 100%; }
.era { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(0,0,0,.08); }
.era-l { position: absolute; top: 2px; left: 4px; font-size: .55rem; font-weight: 600; color: var(--text-light); letter-spacing: .02em; white-space: nowrap; }
.density-ind { position: absolute; bottom: 0; height: 3px; background: var(--primary); opacity: .5; }

/* cursor */
#cur { position: fixed; top: calc(var(--navbar-h) + 26px); bottom: 0; width: 1.5px; background: var(--primary); z-index: 15; pointer-events: none; opacity: .5; display: none; }
#curY { position: fixed; top: calc(var(--navbar-h) + 26px); background: var(--primary); color: #fff; font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 0 0 3px 3px; z-index: 16; pointer-events: none; transform: translateX(-50%); display: none; }

/* timeline */
#tl { position: absolute; top: calc(var(--navbar-h) + 26px); bottom: 0; left: 0; right: 0; overflow: auto; }
#cv { position: relative; min-height: 100%; }

/* lineage SVG overlay */
#lineage { position: absolute; top: 0; left: 150px; pointer-events: none; z-index: 3; }
.line-edge { fill: none; stroke: var(--primary); stroke-width: 1.2; opacity: .25; }
.line-edge.hi { opacity: .9; stroke-width: 2; }
.line-end { fill: var(--primary); opacity: .4; }
.line-end.hi { opacity: 1; }

/* rows */
.row { display: flex; align-items: center; height: 44px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
.row:hover { background: #faf8ff; }
.rl { position: sticky; left: 0; width: 150px; min-width: 150px; padding: 0 10px; font-size: .75rem; font-weight: 500; background: var(--bg); z-index: 5; display: flex; align-items: center; gap: 6px; height: 100%; border-right: 1px solid var(--border); }
.row:hover .rl { background: #faf8ff; }
.rl img { width: 22px; height: 14px; object-fit: contain; border-radius: 1px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.rl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem; }
.rt { flex: 1; position: relative; height: 100%; }

/* flag spans */
.fs { position: absolute; top: 6px; height: 32px; border-radius: 3px; display: flex; align-items: center; gap: 4px; padding: 0 5px; cursor: pointer; transition: all .1s; overflow: hidden; border: 1px solid transparent; min-width: 14px; z-index: 2; color: inherit; text-decoration: none; }
.fs:hover { border-color: var(--primary); z-index: 20; box-shadow: 0 2px 8px rgba(143,0,255,.15); background: #fff; color: inherit; text-decoration: none; }
.fs:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.fs img { width: 22px; height: 14px; object-fit: contain; border-radius: 1px; flex-shrink: 0; }
.fs-n { font-size: .6rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-y { font-size: .52rem; color: var(--text-light); white-space: nowrap; }
.fs.c0{background:rgba(200,70,70,.1)}.fs.c1{background:rgba(60,120,200,.1)}.fs.c2{background:rgba(60,170,80,.1)}.fs.c3{background:rgba(200,150,40,.1)}.fs.c4{background:rgba(160,60,200,.1)}.fs.c5{background:rgba(200,120,40,.1)}.fs.c6{background:rgba(40,160,160,.1)}.fs.c7{background:rgba(160,60,120,.1)}
.fs.now { background: var(--primary-light); border-color: var(--primary-muted); }

/* tooltip */
#tt { position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: none; z-index: 50; box-shadow: 0 3px 10px rgba(0,0,0,.1); max-width: 260px; }
#tt.v { display: block; }
#tt img { width: 48px; height: 30px; object-fit: contain; border-radius: 2px; margin-bottom: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
#tt h3 { font-size: .8rem; font-weight: 600; }
#tt .tm { font-size: .65rem; color: var(--text-light); }
#tt .td { font-size: .6rem; color: var(--text-light); margin-top: 3px; }
#tt .tlin { font-size: .6rem; color: var(--primary); margin-top: 3px; font-weight: 500; }

/* loading */
#ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 100; transition: opacity .4s; }
#ld.off { opacity: 0; pointer-events: none; }
.sp { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: s .7s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
#st { position: fixed; bottom: 6px; left: 6px; font-size: .6rem; color: var(--text-light); z-index: 10; background: rgba(255,255,255,.9); padding: 2px 6px; border-radius: 3px; }

/* legend */
#lg { position: fixed; bottom: 6px; right: 6px; font-size: .6rem; color: var(--text-light); z-index: 10; background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 3px; border: 1px solid var(--border); }
#lg span { display: inline-block; vertical-align: middle; }
.lg-bar { width: 16px; height: 3px; background: var(--primary); opacity: .5; margin-right: 4px; }
.lg-line { width: 14px; height: 1.2px; background: var(--primary); opacity: .6; margin: 0 4px; display: inline-block; }

@media (max-width: 768px) { .rl { width: 90px; min-width: 90px; } .rl img { display: none; } #ruler { left: 90px; } #lineage { left: 90px; } }
/* Narrow phones: the filter/sort pill bar can't fit on one 52px row.
   Bump --navbar-h so the ruler/timeline offsets (which all derive from it)
   stay aligned, stack the logo above the pills, and shrink pill padding. */
@media (max-width: 640px) {
  :root { --navbar-h: 84px; }
  nav {
    padding: 6px 0.75rem;
    flex-direction: column; align-items: stretch;
    gap: 4px;
  }
  .site-logo { align-self: flex-start; line-height: 1; }
  .nav-r { gap: 3px; row-gap: 4px; justify-content: flex-start; }
  .sep { display: none; }
  .nb { padding: 4px 7px; font-size: 0.68rem; }
  /* The density/lineage legend competes with the last table row and its
     meaning is self-evident from the visuals. Drop it on narrow widths. */
  #lg { display: none; }
  #st { font-size: 0.55rem; }
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<nav>
  <a class="site-logo" href="/">flags.fyi</a>
  <div class="nav-r">
    <a class="nb" href="/map/">← Map</a>
    <span class="sep">|</span>
    <button class="nb on" id="fAll">All</button>
    <button class="nb" id="fHist">Historical</button>
    <button class="nb" id="fCur">Current</button>
    <span class="sep">|</span>
    <button class="nb on" id="sTime">by Time</button>
    <button class="nb" id="sName">A–Z</button>
    <button class="nb" id="sCount"># Flags</button>
    <span class="sep">|</span>
    <button class="nb on" id="tLin">Lineage</button>
  </div>
</nav>
<div id="ruler"><div id="rulerCv"></div></div>
<div id="cur"></div><div id="curY"></div>
<div id="tl"><div id="cv"><svg id="lineage"></svg></div></div>
<div id="tt" role="tooltip"><img id="ti" src="" alt=""><h3 id="tn"></h3><div class="tm" id="tm"></div><div class="td" id="td"></div><div class="tlin" id="tlin"></div></div>
<div id="ld"><div class="sp"></div></div>
<div id="st"></div>
<div id="lg"><span class="lg-bar"></span>density · <span class="lg-line"></span>lineage</div>

<script>
(function(){
'use strict';
const B='', LW=150, RH=44, NOW=new Date().getFullYear();

let MD, SC, LIN={}, filter='all', sortBy='time', showLineage=true;
const $=id=>document.getElementById(id);
const syncRuler=()=>{const r=$('rulerCv');if(r)r.style.transform='translateX('+(-$('tl').scrollLeft)+'px)'};

async function init(){
  const[md,sc,lin]=await Promise.all([
    fetch('/map/data.json').then(r=>r.json()),
    fetch('/map/scale.json').then(r=>r.json()),
    fetch('/map/lineage.json').then(r=>r.json()).catch(()=>({}))
  ]);
  MD=md;SC=sc;LIN=lin;
  // Attach scroll listener BEFORE first render so programmatic scrollLeft is in sync
  $('tl').addEventListener('scroll',syncRuler);
  render();setupCursor();setupCtrl();
  $('ld').classList.add('off');
}

/* ── Event-density scale ──
   Each decade is allotted pixels proportional to log(1 + flag events) */
function yrToX(y){
  if(y<=SC.min_yr)return 0;
  if(y>=SC.max_yr)return SC.total_w;
  const decade=Math.floor(y/10)*10;
  for(const d of SC.decades){
    if(d.d===decade){
      return d.x+(y-d.d)*(d.w/10);
    }
  }
  return 0;
}
function xToYr(x){
  for(const d of SC.decades){
    if(x<=d.x+d.w){return Math.round(d.d+(x-d.x)*(10/d.w))}
  }
  return SC.max_yr;
}

function render(){
  const cv=$('cv');cv.innerHTML='<svg id="lineage"></svg>';
  const svg=$('lineage');
  cv.style.width=(SC.total_w+LW)+'px';

  // Ruler: era markers sized by density
  const rCv=$('rulerCv');rCv.innerHTML='';
  rCv.style.width=SC.total_w+'px';
  const labels=[[-500,'500 BC'],[0,'0 CE'],[500,'500'],[1000,'1000'],[1300,'1300'],
    [1500,'1500'],[1600,'1600'],[1700,'1700'],[1800,'1800'],
    [1850,'1850'],[1900,'1900'],[1920,'1920'],[1940,'1940'],[1950,'1950'],
    [1960,'1960'],[1970,'1970'],[1980,'1980'],[1990,'1990'],[2000,'2000'],[2010,'2010'],[2020,'2020']];
  for(const[y,l]of labels){
    const el=document.createElement('div');el.className='era';
    el.style.left=yrToX(y)+'px';
    el.innerHTML='<div class="era-l">'+l+'</div>';
    rCv.appendChild(el);
  }
  // Density indicator bars along ruler
  for(const d of SC.decades){
    if(d.events>2){
      const bar=document.createElement('div');bar.className='density-ind';
      bar.style.left=d.x+'px';bar.style.width=d.w+'px';
      bar.style.opacity=Math.min(0.8, d.events/40);
      rCv.appendChild(bar);
    }
  }

  // Build country list
  let countries=Object.values(MD).map(c=>{
    const hist=c.flags.filter(f=>!f.is_sub&&f.year_start);
    const earliest=hist.length?Math.min(...hist.map(f=>f.year_start)):9999;
    return{...c,histCount:hist.length,earliest};
  });
  if(filter==='hist')countries=countries.filter(c=>c.histCount>0);
  if(filter==='cur')countries=countries.filter(c=>c.flags.some(f=>f.is_current));
  if(sortBy==='time')countries.sort((a,b)=>a.earliest-b.earliest||b.histCount-a.histCount);
  else if(sortBy==='name')countries.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if(sortBy==='count')countries.sort((a,b)=>b.flags.length-a.flags.length);

  // Track each country's row index for lineage drawing
  const rowY={};
  countries.forEach((c,i)=>rowY[c.id]=i);

  // Store span positions for lineage: slug → {x, row, endYr}
  const spanPos={};

  let n=0;
  for(let i=0;i<countries.length;i++){
    const c=countries[i];
    const row=document.createElement('div');row.className='row';

    const label=document.createElement('div');label.className='rl';
    const flagImg=c.current_flag?'<img src="'+B+c.current_flag+'" alt="" onerror="this.style.display=\'none\'">':'';
    label.innerHTML=flagImg+'<span>'+(c.name||'')+'</span>';
    row.appendChild(label);

    const track=document.createElement('div');track.className='rt';track.style.width=SC.total_w+'px';

    let flags=c.flags.filter(f=>!f.is_sub);
    if(filter==='hist')flags=flags.filter(f=>f.year_start&&!f.is_current);
    if(filter==='cur')flags=flags.filter(f=>f.is_current);

    // Sort by year for proper layout + next-sibling detection
    flags.sort((a,b)=>(a.year_start||9999)-(b.year_start||9999));

    const ci=i%8;
    for(let j=0;j<flags.length;j++){
      const f=flags[j];
      if(f.year_start==null&&!f.is_current)continue;
      const start=f.year_start!=null?f.year_start:(NOW-10);
      const end=f.year_end!=null?f.year_end:(f.is_current?NOW:(start+40));
      const x1=yrToX(Math.max(start,SC.min_yr));
      const x2=yrToX(Math.min(end,SC.max_yr));
      const w=Math.max(x2-x1,14);

      // Find next span's x for overlap avoidance
      const next=flags[j+1];
      const nextX=next?yrToX(next.year_start||9999):Infinity;
      const availW=Math.min(w,nextX-x1-4);

      const span=document.createElement('a');
      span.className='fs '+(f.is_current?'now':'c'+ci);
      span.href='/'+f.slug+'/';
      span.style.left=x1+'px';span.style.width=w+'px';

      const sL=start<0?Math.abs(start)+' BC':start;
      const yrRange=sL+(end<NOW?'–'+end:'–present');
      span.title=f.name+' ('+yrRange+')';
      span.setAttribute('aria-label',span.title);
      let content='<img src="'+B+f.flag_svg+'" alt="" onerror="this.style.display=\'none\'">';
      if(availW>80)content+='<span class="fs-n">'+f.name+'</span>';
      if(availW>160)content+='<span class="fs-y">'+sL+(end<NOW?' – '+end:'')+'</span>';
      span.innerHTML=content;

      span.onmouseover=e=>{showTT(e,f,c);hiLin(f.slug)};
      span.onmousemove=e=>moveTT(e);
      span.onmouseout=()=>{hideTT();unHiLin()};
      track.appendChild(span);

      // Record position for lineage
      spanPos[f.slug]={row:i, x1, x2, endYr:end, startYr:start};
      n++;
    }
    row.appendChild(track);cv.appendChild(row);
  }
  $('st').textContent=countries.length+' countries · '+n+' flags';

  // Draw lineage edges
  if(showLineage){drawLineage(spanPos,rowY,countries.length)}
  else{svg.style.display='none'}

  // Scroll (and explicitly sync ruler; programmatic scrollLeft fires events async)
  const tl=$('tl');
  if(filter==='cur')tl.scrollLeft=yrToX(1940)-100;
  else tl.scrollLeft=yrToX(1700)-50;
  syncRuler();
}

/* ── Lineage ──
   LIN: flag_slug → [country_ids it became]
   Draw curves from the end of a flag span → the start of the target country's next flag */
function drawLineage(spanPos,rowY,numRows){
  const svg=$('lineage');
  svg.setAttribute('width',SC.total_w);
  svg.setAttribute('height',numRows*RH);
  svg.innerHTML='';

  // For each flag with lineage, find end-point → target country's earliest flag after its end
  for(const[srcSlug,targets]of Object.entries(LIN)){
    const src=spanPos[srcSlug];
    if(!src)continue;
    for(const tgtId of targets){
      const tgtIdClean=tgtId.trim();
      if(rowY[tgtIdClean]===undefined)continue;
      // Find target country's first flag that starts at or after src's end
      const tgtC=MD[tgtIdClean];
      if(!tgtC)continue;
      const tgtFlag=tgtC.flags
        .filter(f=>!f.is_sub&&f.year_start&&f.year_start>=src.endYr-5)
        .sort((a,b)=>a.year_start-b.year_start)[0];
      const tgtSlug=tgtFlag?tgtFlag.slug:null;
      const tgt=tgtSlug?spanPos[tgtSlug]:null;

      // If target country exists in view but no matching later flag, connect to row
      const srcY=src.row*RH+RH/2;
      let endX, endY;
      if(tgt){endX=tgt.x1;endY=tgt.row*RH+RH/2}
      else{
        // Draw to row center at same x
        endX=src.x2+20;endY=rowY[tgtIdClean]*RH+RH/2;
      }
      const startX=src.x2;

      // Bezier curve
      const midX=(startX+endX)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${startX},${srcY} C${midX},${srcY} ${midX},${endY} ${endX},${endY}`);
      path.setAttribute('class','line-edge');
      path.dataset.src=srcSlug;
      path.dataset.tgt=tgtIdClean;
      svg.appendChild(path);
      // Endpoint dot
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',endX);dot.setAttribute('cy',endY);dot.setAttribute('r',2.5);
      dot.setAttribute('class','line-end');
      dot.dataset.src=srcSlug;
      svg.appendChild(dot);
    }
  }
}

function hiLin(srcSlug){
  $('lineage').querySelectorAll('.line-edge,.line-end').forEach(el=>{
    if(el.dataset.src===srcSlug)el.classList.add('hi');
  });
}
function unHiLin(){
  $('lineage').querySelectorAll('.line-edge.hi,.line-end.hi').forEach(el=>el.classList.remove('hi'));
}

function setupCursor(){
  const tl=$('tl'),c=$('cur'),cy=$('curY');
  tl.onmousemove=e=>{
    const r=tl.getBoundingClientRect(),x=e.clientX;
    c.style.left=x+'px';cy.style.left=x+'px';
    const tx=x-r.left-LW+tl.scrollLeft;
    const y=xToYr(tx);
    if(y>=SC.min_yr&&y<=SC.max_yr){cy.textContent=y<0?Math.abs(y)+' BC':y;c.style.display=cy.style.display='block'}
    else c.style.display=cy.style.display='none';
  };
  tl.onmouseleave=()=>c.style.display=cy.style.display='none';
  // Ruler-scroll sync listener is attached in init() before first render
}

function showTT(e,f,c){
  $('ti').src=B+f.flag_svg;$('tn').textContent=f.name;
  let m='';if(f.year_start){const s=f.year_start<0?Math.abs(f.year_start)+' BC':f.year_start;m=f.year_end?s+' – '+f.year_end:'From '+s}
  if(f.is_current)m+=(m?' · ':'')+'Current';
  $('tm').textContent=m;
  $('td').textContent=(c.name||'')+' · Click to open';
  // Lineage info
  const lin=LIN[f.slug];
  if(lin&&lin.length){
    const names=lin.map(id=>{const c=MD[id.trim()];return c?c.name:id}).join(', ');
    $('tlin').textContent='→ became '+names;
    $('tlin').style.display='block';
  }else{$('tlin').style.display='none'}
  $('tt').classList.add('v');moveTT(e);
}
function moveTT(e){const t=$('tt');let x=e.clientX+12,y=e.clientY-8;if(x+260>innerWidth)x=e.clientX-270;if(y+120>innerHeight)y=e.clientY-130;t.style.left=x+'px';t.style.top=y+'px'}
function hideTT(){$('tt').classList.remove('v')}

function setupCtrl(){
  const setF=(f,btn)=>{filter=f;['fAll','fHist','fCur'].forEach(id=>$(id).classList.remove('on'));btn.classList.add('on');render()};
  const setS=(s,btn)=>{sortBy=s;['sTime','sName','sCount'].forEach(id=>$(id).classList.remove('on'));btn.classList.add('on');render()};
  $('fAll').onclick=function(){setF('all',this)};
  $('fHist').onclick=function(){setF('hist',this)};
  $('fCur').onclick=function(){setF('cur',this)};
  $('sTime').onclick=function(){setS('time',this)};
  $('sName').onclick=function(){setS('name',this)};
  $('sCount').onclick=function(){setS('count',this)};
  $('tLin').onclick=function(){showLineage=!showLineage;this.classList.toggle('on',showLineage);render()};
}

init().catch(e=>{console.error(e);$('ld').innerHTML='<div style="color:var(--text-light)">'+e.message+'</div>'});
})();
</script>
</body>
</html>
